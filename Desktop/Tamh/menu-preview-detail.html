<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAMH — Menu + Detail Preview</title>
<style>
  :root{
    --bg:#0e0e10;
    --panel:#17171a;
    --panel-2:#1d1d21;
    --border:#2a2a2f;
    --gold:#c9a25b;
    --gold-soft:#c9a25b33;
    --text:#ece8e0;
    --text-dim:#9a958c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:40px 24px 22px;
    text-align:center;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:20;
  }
  header h1{
    font-family:Georgia, 'Times New Roman', serif;
    letter-spacing:6px;
    font-size:30px;
    margin:0 0 6px;
    color:var(--text);
  }
  header p.tagline{
    margin:0;
    letter-spacing:3px;
    font-size:11px;
    color:var(--gold);
    text-transform:uppercase;
  }

  .wrap{
    max-width:1080px;
    margin:0 auto;
    padding:22px 18px 90px;
  }

  .search-box{
    width:100%;
    padding:13px 16px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    font-size:14px;
    margin-bottom:16px;
    outline:none;
  }
  .search-box::placeholder{ color:var(--text-dim); }
  .search-box:focus{ border-color:var(--gold); }

  .cat-bar{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:14px;
    margin-bottom:6px;
    scrollbar-width:thin;
  }
  .cat-chip{
    flex:0 0 auto;
    padding:9px 16px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text-dim);
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
    user-select:none;
  }
  .cat-chip.active{
    background:var(--text);
    color:#0e0e10;
    border-color:var(--text);
    font-weight:600;
  }

  .filter-toggle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:10px 0 10px;
  }
  .filter-toggle-row .label-strong{
    font-size:12px;
    letter-spacing:1px;
    color:var(--text-dim);
    text-transform:uppercase;
  }
  .filter-toggle-btn{
    padding:8px 14px;
    border-radius:8px;
    border:1px solid var(--gold);
    background:var(--gold-soft);
    color:var(--gold);
    font-size:12px;
    cursor:pointer;
  }

  .filter-bar{
    display:none;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:18px;
    padding:14px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
  }
  .filter-bar.open{ display:flex; }
  .filter-chip{
    padding:7px 13px;
    border:1px solid var(--border);
    border-radius:999px;
    background:var(--panel-2);
    color:var(--text-dim);
    font-size:12px;
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  .filter-chip:hover{ border-color:var(--gold); color:var(--text); }
  .filter-chip.active{
    background:var(--gold-soft);
    border-color:var(--gold);
    color:var(--gold);
  }
  .filter-chip .count{ opacity:.6; font-size:10px; margin-left:4px; }
  .filter-clear{
    padding:7px 13px;
    border-radius:999px;
    background:transparent;
    color:var(--text-dim);
    font-size:12px;
    border:1px dashed var(--border);
    cursor:pointer;
  }

  .section-title{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin:26px 0 12px;
    padding-bottom:8px;
    border-bottom:1px solid var(--border);
  }
  .section-title h2{
    font-size:13px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--text);
    margin:0;
  }
  .section-title span{ font-size:11px; color:var(--text-dim); }

  .row{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
    transition:border-color .15s ease;
  }
  .row.hidden{ display:none; }
  .row:hover{ border-color:#3a3a40; }

  .row-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .row-names{ min-width:0; }
  .name-en{
    font-size:15px;
    font-weight:600;
    color:var(--text);
    margin:0;
  }
  .name-kr{
    font-size:11.5px;
    color:var(--text-dim);
    margin:2px 0 0;
  }
  .row-right{
    display:flex;
    align-items:center;
    gap:10px;
    flex:0 0 auto;
  }
  .price{
    font-size:14px;
    color:var(--gold);
    white-space:nowrap;
    font-weight:600;
  }
  .detail-btn{
    padding:7px 14px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text-dim);
    font-size:11.5px;
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
    white-space:nowrap;
  }
  .detail-btn:hover{ border-color:var(--gold); color:var(--gold); }
  .detail-btn.open{
    background:var(--gold-soft);
    border-color:var(--gold);
    color:var(--gold);
  }

  .detail-panel{
    display:none;
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--border);
  }
  .detail-panel.open{ display:block; }

  .desc{
    font-size:13px;
    line-height:1.6;
    color:#cfcac1;
    margin-bottom:12px;
  }
  .label{
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  .tag-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .tag{
    font-size:11px;
    padding:4px 10px;
    border-radius:999px;
    background:var(--panel-2);
    color:var(--text-dim);
    border:1px solid var(--border);
  }
  .tag.is-match{
    border-color:var(--gold);
    color:var(--gold);
    background:var(--gold-soft);
  }
  .similar-row{
    font-size:12px;
    color:var(--text-dim);
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    align-items:center;
  }
  .similar-pill{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:3px 9px;
    border-radius:8px;
    font-size:11px;
  }

  .empty-state{
    text-align:center;
    color:var(--text-dim);
    padding:60px 0;
    font-size:13px;
    display:none;
  }

  footer{
    text-align:center;
    padding:30px 0 50px;
    color:var(--text-dim);
    font-size:11px;
    letter-spacing:2px;
  }
</style>
</head>
<body>

<header>
  <h1>TAMH</h1>
  <p class="tagline">SINGLE MALT · COCKTAIL · BAR</p>
</header>

<div class="wrap">
  <input class="search-box" id="searchBox" placeholder="메뉴 검색 (영문 / 한글)">

  <div class="cat-bar" id="catBar"></div>

  <div class="filter-toggle-row">
    <span class="label-strong" id="resultCount"></span>
    <button class="filter-toggle-btn" id="filterToggleBtn">이런 손님에게 좋아요 필터 ▾</button>
  </div>

  <div class="filter-bar" id="filterBar"></div>

  <div id="sections"></div>

  <div class="empty-state" id="emptyState">조건에 맞는 메뉴가 없어요.</div>
</div>

<footer>TAMH BAR · MENU + DETAIL PREVIEW (LOCAL, 실제 사이트 미적용)</footer>

    const chip = document.createElement('div');
    chip.className = 'cat-chip' + (activeCat === c ? ' active' : '');
    chip.textContent = c === '전체' ? '전체' : c;
    chip.onclick = () => { activeCat = c; render(); };
    catBar.appendChild(chip);
  });
}

function tagCount(tag){
  return items.filter(i => i.tags.includes(tag)).length;
}

function renderFilterBar(){
  filterBar.className = 'filter-bar' + (filterBarOpen ? ' open' : '');
  filterBar.innerHTML = '';
  allTags.forEach(tag => {
    const chip = document.createElement('div');
    chip.className = 'filter-chip' + (activeTags.has(tag) ? ' active' : '');
    chip.innerHTML = tag + '<span class="count">' + tagCount(tag) + '</span>';
    chip.onclick = () => {
      if(activeTags.has(tag)) activeTags.delete(tag);
      else activeTags.add(tag);
      render();
    };
    filterBar.appendChild(chip);
  });
  const clear = document.createElement('div');
  clear.className = 'filter-clear';
  clear.textContent = '필터 초기화';
  clear.onclick = () => { activeTags.clear(); render(); };
  filterBar.appendChild(clear);
}

function matches(item){
  if(activeCat !== '전체' && item.cat !== activeCat) return false;
  if(activeTags.size > 0 && !item.tags.some(t => activeTags.has(t))) return false;
  if(searchText){
    const s = searchText.toLowerCase();
    if(!item.en.toLowerCase().includes(s) && !item.kr.includes(searchText)) return false;
  }
  return true;
}

function renderRow(item){
  const row = document.createElement('div');
  row.className = 'row';
  const isOpen = openDetail.has(key(item));

  const tagsHtml = item.tags.map(t =>
    '<span class="tag' + (activeTags.has(t) ? ' is-match' : '') + '">' + t + '</span>'
  ).join('');
  const similarHtml = item.similar.map(s =>
    '<span class="similar-pill">' + s + '</span>'
  ).join('');

  row.innerHTML = `
    <div class="row-top">
      <div class="row-names">
        <p class="name-en">${item.en}</p>
        <p class="name-kr">${item.kr}</p>
      </div>
      <div class="row-right">
        <div class="price">${item.price}</div>
        <button class="detail-btn${isOpen ? ' open' : ''}" data-key="${key(item)}">Detail</button>
      </div>
    </div>
    <div class="detail-panel${isOpen ? ' open' : ''}">
      <div class="desc">${item.desc}</div>
      <div class="label">이런 손님에게 좋아요</div>
      <div class="tag-row">${tagsHtml}</div>
      <div class="label">유사 위스키</div>
      <div class="similar-row">${similarHtml}</div>
    </div>
  `;

  row.querySelector('.detail-btn').onclick = () => {
    const k = key(item);
    if(openDetail.has(k)) openDetail.delete(k);
    else openDetail.add(k);
    renderSections();
  };

  return row;
}

function renderSections(){
  sectionsEl.innerHTML = '';
  let shown = 0;
  const cats = activeCat === '전체' ? catsOrder : [activeCat];
  cats.forEach(cat => {
    const catItems = items.filter(i => i.cat === cat && matches(i));
    if(catItems.length === 0) return;
    shown += catItems.length;
    const section = document.createElement('div');
    section.innerHTML = `<div class="section-title"><h2>${cat}</h2><span>${catItems.length}종</span></div>`;
    const list = document.createElement('div');
    catItems.forEach(item => list.appendChild(renderRow(item)));
    section.appendChild(list);
    sectionsEl.appendChild(section);
  });
  resultCount.textContent = shown + '종 표시 중';
  emptyState.style.display = shown === 0 ? 'block' : 'none';
}

function render(){
  renderCatBar();
  renderFilterBar();
  renderSections();
}

searchBox.addEventListener('input', e => { searchText = e.target.value.trim(); render(); });
filterToggleBtn.addEventListener('click', () => { filterBarOpen = !filterBarOpen; render(); });

render();
</script>

</body>
</html>
